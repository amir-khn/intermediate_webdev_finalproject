<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Interest Rate Calculator</title>
  <meta name="description" content="Calculate simple interest and total amount easily using principal, rate, and time." />
  <link rel="icon" type="image/x-icon" href="favicon.ico" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main>
    <h1>Interest Rate Calculator</h1>

    <label for="principal">Principal Amount:</label>
    <input type="number" id="principal" step="any" />

    <label for="rate">Annual Interest Rate (%):</label>
    <input type="number" id="rate" step="any" />

    <label for="time">Time (Years):</label>
    <input type="number" id="time" step="any" />

    <button type="button" id="calculateBtn">Calculate</button>

    <p id="simpleInterestResult">Simple Interest: 0.00</p>
    <p id="totalAmountResult">Total Amount: 0.00</p>
  </main>

  <script src="script.js"></script>
</body>
</html>
