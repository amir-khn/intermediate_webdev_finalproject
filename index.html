
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Interest Rate Calculator | Calculate Your Loan Interest</title>

    <meta name="description"
        content="Calculate your loan interest, monthly payments, and total repayment easily with our free Interest Rate Calculator.">

    <meta name="keywords"
        content="interest rate calculator, loan calculator, monthly payment, interest">

    <meta name="author" content="Amir Khan">

    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="style.css">

    <script src="script.js" defer></script>
</head>

<body>

    <main class="calculator-container">

        <h1>Interest Rate Calculator</h1>

        <p class="description">
            Calculate your monthly loan payments and total interest.
        </p>

        <form id="calculatorForm">

            <label for="principal">Loan Amount ($)</label>
            <input type="number" id="principal"
                placeholder="Enter loan amount" min="0.01"
                step="any" required>

            <label for="rate">Annual Interest Rate (%)</label>
            <input type="number" id="rate"
                placeholder="Enter interest rate" min="0"
                step="any" required>

            <label for="years">Loan Duration (Years)</label>
            <input type="number" id="years"
                placeholder="Enter years" min="0.01"
                step="any" required>

            <button type="submit">Calculate Interest</button>

        </form>

        <section id="results" aria-live="polite">
            <h2>Calculation Results</h2>

            <p>Monthly Payment: <strong id="monthlyPayment">$0.00</strong></p>

            <p>Total Payment: <strong id="totalPayment">$0.00</strong></p>

            <p>Total Interest: <strong id="totalInterest">$0.00</strong></p>
        </section>

        <p id="errorMessage" role="alert"></p>

    </main>

</body>
</html>
