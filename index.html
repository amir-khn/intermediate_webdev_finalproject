
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Interest Rate Calculator</title>

    <meta name="description" content="Calculate simple interest and total investment returns using our free Interest Rate Calculator.">

    <link rel="icon" href="./favicon.ico" type="image/x-icon">

    <link rel="stylesheet" href="./style.css">
</head>
<body>

    <main class="container">
        <h1>Interest Rate Calculator</h1>

        <p>Calculate your simple interest easily.</p>

        <label for="principal">Principal Amount ($)</label>
        <input type="number" id="principal" placeholder="Enter amount">

        <label for="rate">Interest Rate (%)</label>
        <input type="number" id="rate" placeholder="Enter rate">

        <label for="time">Time (Years)</label>
        <input type="number" id="time" placeholder="Enter years">

        <button type="button" id="calculateBtn">
            Calculate Interest
        </button>

        <div id="result" aria-live="polite"></div>
    </main>

    <script src="./script.js"></script>
</body>
</html>
