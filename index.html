
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Interest Rate Calculator</title>

    <meta name="description" content="Free Interest Rate Calculator to calculate simple interest and total investment returns quickly and accurately.">

    <link rel="icon" href="./favicon.ico" type="image/x-icon">

    <link rel="stylesheet" href="./style.css">
</head>

<body>

    <main class="container">

        <h1>Interest Rate Calculator</h1>

        <p>Calculate your simple interest easily.</p>

        <label for="principal">Principal Amount ($)</label>
        <input type="number" id="principal" placeholder="Enter principal amount">

        <label for="rate">Interest Rate (%)</label>
        <input type="number" id="rate" placeholder="Enter interest rate">

        <label for="time">Time (Years)</label>
        <input type="number" id="time" placeholder="Enter time">

        <button id="calculateBtn" type="button">
            Calculate Interest
        </button>

        <div id="result" aria-live="polite"></div>

    </main>

    <script src="./script.js"></script>

</body>
</html>
